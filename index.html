<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프리랜서 강사 AI 루틴 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased py-8 px-4">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- 상단 헤더 -->
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
      <div>
        <span class="inline-block px-2.5 py-1 text-xs font-semibold bg-indigo-500/20 text-indigo-400 rounded-full border border-indigo-500/30">Freelance Lecturer Routine</span>
        <h1 class="text-2xl font-bold mt-2 text-white">AI 개인 최적화 루틴 플래너</h1>
        <p class="text-sm text-slate-400 mt-1">불규칙한 강의 일정에 맞춰 공부·강의준비·운동·이동 시간을 자동으로 재배치합니다.</p>
      </div>

      <!-- API Key 설정 바 -->
      <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 w-full md:w-80">
        <label class="block text-xs font-medium text-slate-300 mb-1">Gemini API Key 설정</label>
        <div class="flex gap-2">
          <input type="password" id="userApiKey" placeholder="AIzaSy... 입력" class="w-full text-xs bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500" />
          <button id="saveKeyBtn" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded-lg text-white font-medium whitespace-nowrap transition-colors">저장</button>
        </div>
        <p id="keyStatus" class="text-[11px] text-amber-400 mt-1">⚠️ API Key를 등록해야 호출할 수 있습니다.</p>
      </div>
    </header>

    <!-- 상태 알림창 -->
    <div id="statusBanner" class="hidden text-xs rounded-xl p-3 flex items-start space-x-2">
      <span id="statusIcon" class="font-bold shrink-0"></span>
      <span id="statusMessage" class="flex-1"></span>
    </div>

    <!-- 메인 레이아웃 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 입력 폼 -->
      <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-800 space-y-4 h-fit">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-semibold text-slate-200">오늘의 일정 조건</h2>
          <button type="button" id="loadSampleBtn" class="text-xs text-indigo-400 hover:text-indigo-300">예시 채우기</button>
        </div>

        <form id="routineForm" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">엔진 동작 방식</label>
            <div class="text-[11px] text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 rounded-lg p-2 font-mono">
              ⚡ 내 계정 활성 모델 자동 탐색 & 다중 리전 분산
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">활동 가능 시간 (기상 - 취침)</label>
            <input type="text" id="wakeSleepTime" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" value="07:30 - 23:30" />
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">고정 강의 및 미팅 일정</label>
            <textarea id="fixedSchedules" rows="4" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" placeholder="예: 14:00 - 17:00 강남 세미나&#10;19:30 - 21:00 온라인 강의" required>14:00 - 17:00 강남 파이낸스센터 오프라인 강의
20:00 - 21:30 온라인 줌 질의응답</textarea>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">채우고 싶은 루틴 (공부/운동 등)</label>
            <textarea id="priorities" rows="3" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500">강의 슬라이드 보완 1시간 30분
근력 운동 40분
강의 주제 최신 트렌드 리딩 40분</textarea>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">특이사항/이동 팁</label>
            <input type="text" id="notes" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:border-indigo-500" value="강의 전 목 관리, 이동 시간 팟캐스트 청취" />
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-3 rounded-lg transition-all shadow-md">
            AI 맞춤 루틴 재배치하기
          </button>
        </form>
      </div>

      <!-- 타임라인 뷰 -->
      <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-800 md:col-span-2">
        <h2 class="text-sm font-semibold text-slate-200 mb-4 pb-2 border-b border-slate-700/60">생성된 스마트 타임라인</h2>

        <!-- 빈 상태 안내 -->
        <div id="emptyState" class="py-24 text-center">
          <div class="w-12 h-12 bg-slate-700/40 rounded-xl mx-auto flex items-center justify-center text-slate-400 mb-3">📅</div>
          <p class="text-sm font-medium text-slate-300">아직 생성된 플랜이 없습니다</p>
          <p class="text-xs text-slate-500 mt-1">상단에 API 키를 입력한 뒤 [AI 맞춤 루틴 재배치하기]를 눌러보세요.</p>
        </div>

        <!-- 로딩 인디케이터 -->
        <div id="loading" class="hidden py-24 text-center space-y-3">
          <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p id="loadingText" class="text-xs text-slate-400">일정을 분석하여 루틴을 재배치 중입니다...</p>
        </div>

        <!-- 결과 컨테이너 -->
        <div id="resultContainer" class="hidden space-y-4">
          <div id="summaryCard" class="bg-indigo-950/40 border border-indigo-500/30 p-3.5 rounded-xl text-xs text-indigo-200 font-medium"></div>
          <div id="timelineList" class="relative pl-6 space-y-4 before:content-[''] before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-700"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const categoryBadgeColors = {
      '강의': 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      '강의준비': 'bg-blue-500/20 text-blue-300 border-blue-500/40',
      '공부': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      '운동': 'bg-rose-500/20 text-rose-300 border-rose-500/40',
      '이동': 'bg-purple-500/20 text-purple-300 border-purple-500/40',
      '휴식/식사': 'bg-slate-600/20 text-slate-300 border-slate-600/40'
    };

    const keyInput = document.getElementById('userApiKey');
    const keyStatus = document.getElementById('keyStatus');
    const storedKey = localStorage.getItem('GEMINI_USER_KEY');
    if (storedKey) {
      keyInput.value = storedKey;
      keyStatus.textContent = '✅ API Key가 준비되었습니다.';
      keyStatus.className = 'text-[11px] text-emerald-400 mt-1';
    }

    document.getElementById('saveKeyBtn').addEventListener('click', () => {
      let val = keyInput.value.trim().replace(/^["']|["']$/g, '');
      if (!val) {
        alert('API Key를 입력해주세요.');
        return;
      }
      localStorage.setItem('GEMINI_USER_KEY', val);
      keyInput.value = val;
      keyStatus.textContent = '✅ API Key가 저장되었습니다.';
      keyStatus.className = 'text-[11px] text-emerald-400 mt-1';
    });

    function showStatus(message, isError = true) {
      const banner = document.getElementById('statusBanner');
      const msg = document.getElementById('statusMessage');
      const icon = document.getElementById('statusIcon');
      banner.className = isError 
        ? 'bg-rose-950/80 border border-rose-800/80 text-rose-200 text-xs rounded-xl p-3 flex items-start space-x-2'
        : 'bg-amber-950/80 border border-amber-800/80 text-amber-200 text-xs rounded-xl p-3 flex items-start space-x-2';
      icon.textContent = isError ? '⚠️ 오류:' : 'ℹ️ 안내:';
      msg.textContent = message;
      banner.classList.remove('hidden');
    }

    // 1. 내 API 키로 사용 가능한 모델 목록을 실시간으로 가져오는 함수
    async function getAvailableModelList(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (!res.ok) return [];
        const data = await res.json();
        // generateContent 메소드를 지원하는 Flash 계열 모델 필터링
        return (data.models || [])
          .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
          .map(m => m.name.replace('models/', ''))
          .filter(name => name.includes('flash') || name.includes('pro'));
      } catch (e) {
        return [];
      }
    }

    // 2. 가용 모델을 순회하며 지연시간 기반 재시도하는 호출 엔진
    async function executeSmartGenerate(apiKey, payloadBody, onProgress) {
      onProgress?.('내 API Key에서 지원하는 가용 모델 리스트를 탐색 중...');
      let modelPool = await getAvailableModelList(apiKey);

      // 리스트 조회가 실패하거나 비어있을 경우 하드코딩 대체 풀 사용
      if (!modelPool.length) {
        modelPool = ['gemini-3.8-flash', 'gemini-3-flash-preview', 'gemini-2.5-flash'];
      }

      onProgress?.(`사용 가능한 후보 모델 (${modelPool.length}개) 확인 완료`);

      let lastError = '';

      for (let i = 0; i < modelPool.length; i++) {
        const modelName = modelPool[i];
        onProgress?.(`[${modelName}] 모델로 최적화 생성 시도 중... (${i + 1}/${modelPool.length})`);

        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payloadBody)
          });

          if (response.ok) {
            return await response.json();
          }

          const errJson = await response.json().catch(() => ({}));
          const errMsg = errJson.error?.message || `HTTP ${response.status}`;
          lastError = errMsg;

          const isOverloaded = errMsg.includes('high demand') || response.status === 429 || response.status === 503;

          // 과부하 발생 시 1초 대기 후 다음 모델로 자동 전환
          if (isOverloaded && i < modelPool.length - 1) {
            onProgress?.(`[${modelName}] 과부하 감지됨. 다음 후보 모델(${modelPool[i + 1]})로 즉시 우회 중...`);
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }

          if (!isOverloaded && !errMsg.includes('not found')) {
            throw new Error(errMsg);
          }
        } catch (err) {
          lastError = err.message;
          if (i < modelPool.length - 1) {
            await new Promise(r => setTimeout(r, 800));
            continue;
          }
        }
      }

      throw new Error(`모든 모델이 현재 일시적으로 혼잡합니다. 10초 후 다시 시도해주세요. (${lastError})`);
    }

    document.getElementById('routineForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const apiKey = keyInput.value.trim() || localStorage.getItem('GEMINI_USER_KEY');
      const banner = document.getElementById('statusBanner');
      banner.classList.add('hidden');

      if (!apiKey) {
        showStatus('상단 Gemini API Key 입력창에 Google AI Studio에서 발급받은 키를 먼저 입력하고 [저장]을 눌러주세요.');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const loadingText = document.getElementById('loadingText');
      const resultContainer = document.getElementById('resultContainer');
      const emptyState = document.getElementById('emptyState');
      const timelineList = document.getElementById('timelineList');
      const summaryCard = document.getElementById('summaryCard');

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      emptyState.classList.add('hidden');

      const wakeSleepTime = document.getElementById('wakeSleepTime').value;
      const fixedSchedules = document.getElementById('fixedSchedules').value;
      const priorities = document.getElementById('priorities').value;
      const notes = document.getElementById('notes').value;

      const prompt = `
당신은 프리랜서 강사를 위한 개인 맞춤형 지능형 루틴 설계사입니다.
불규칙한 강의 일정 사이에 공부, 강의준비, 운동, 이동 시간, 휴식을 최적으로 배치해 하루 시간표를 작성하세요.

[사용자 스케줄]
- 활동 가능 시간: ${wakeSleepTime}
- 고정 일정(강의/미팅): ${fixedSchedules}
- 채우고 싶은 루틴: ${priorities}
- 메모/요구사항: ${notes}

[규칙]
1. 반드시 아래의 순수 JSON 형식으로만 응답하세요. 마크다운(\`\`\`)이나 기타 서문/후문 텍스트는 절대 붙이지 마세요.
2. category 필드는 반드시 다음 6가지 중 하나만 사용하세요: ["강의", "강의준비", "공부", "운동", "이동", "휴식/식사"]
3. 고정 일정 전후에는 최소 20~30분의 여유/이동 버퍼를 배치하세요.

[반환 JSON 규격]
{
  "summary": "오늘 하루 루틴 운용을 위한 조언 한마디",
  "schedule": [
    {
      "time": "08:00 - 09:00",
      "activity": "활동 내용",
      "category": "강의준비",
      "tip": "실행을 돕는 구체적 팁"
    }
  ]
}
`;

      const requestBody = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
          responseMimeType: "application/json"
        }
      };

      try {
        const data = await executeSmartGenerate(apiKey, requestBody, (msg) => {
          loadingText.textContent = msg;
        });

        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('응답 내용을 전달받지 못했습니다.');

        const parsed = JSON.parse(rawText.replace(/```json|```/g, '').trim());

        summaryCard.textContent = `💡 루틴 전략: ${parsed.summary}`;
        timelineList.innerHTML = '';

        parsed.schedule.forEach(item => {
          const badgeClass = categoryBadgeColors[item.category] || 'bg-slate-700 text-slate-300 border-slate-600';
          const el = document.createElement('div');
          el.className = 'relative flex items-start space-x-3';
          el.innerHTML = `
            <div class="absolute -left-6 mt-1.5 w-2 h-2 rounded-full bg-slate-500 ring-4 ring-slate-900"></div>
            <div class="flex-1 bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 hover:border-slate-700 transition-colors">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-xs font-semibold text-slate-400">${item.time}</span>
                <span class="text-[10px] font-medium px-2 py-0.5 rounded-full border ${badgeClass}">${item.category}</span>
              </div>
              <p class="text-xs font-semibold text-white">${item.activity}</p>
              <p class="text-[11px] text-slate-400 mt-1">💡 ${item.tip}</p>
            </div>
          `;
          timelineList.appendChild(el);
        });

        resultContainer.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        showStatus(err.message);
        emptyState.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    });

    document.getElementById('loadSampleBtn').addEventListener('click', () => {
      document.getElementById('wakeSleepTime').value = '07:00 - 23:30';
      document.getElementById('fixedSchedules').value = '10:00 - 12:00 기업 온라인 웨비나\n15:00 - 18:00 판교 스타트업 출강';
      document.getElementById('priorities').value = '스피치 교재 수정 1시간\n러닝 30분\n신기술 트렌드 스터디 45분';
      document.getElementById('notes').value = '대중교통 이동 중 오디오 강의 청취, 판교 도착 후 현장 세팅 20분 확보';
    });
  </script>
</body>
</html>
