<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프리랜서 강사 AI 루틴 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased py-10 px-4">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- 상단 헤더 -->
    <header class="text-center pb-6 border-b border-slate-800">
      <span class="inline-block px-3 py-1 text-xs font-semibold bg-indigo-500/20 text-indigo-400 rounded-full border border-indigo-500/30">Freelancer Routine Optimizer</span>
      <h1 class="text-3xl font-bold mt-3 text-white">AI 개인 맞춤형 루틴 플래너</h1>
      <p class="text-sm text-slate-400 mt-2">불규칙한 강의 일정에 맞춰 공부·강의준비·운동·이동 시간을 자동으로 재배치합니다.</p>
    </header>

    <!-- 에러 알림창 -->
    <div id="errorBanner" class="hidden bg-rose-950/80 border border-rose-800/80 text-rose-200 text-xs rounded-xl p-4 flex items-start space-x-2">
      <span class="text-rose-400 font-bold shrink-0">⚠️ 오류:</span>
      <span id="errorMessage" class="flex-1"></span>
    </div>

    <!-- 메인 레이아웃 -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- 입력 폼 -->
      <section class="bg-slate-800/50 p-6 rounded-2xl border border-slate-800 space-y-4 h-fit">
        <div class="flex justify-between items-center pb-2 border-b border-slate-700/60">
          <h2 class="text-sm font-semibold text-slate-200">오늘의 일정 조건</h2>
          <button type="button" id="loadSampleBtn" class="text-xs text-indigo-400 hover:text-indigo-300">예시 채우기</button>
        </div>

        <form id="routineForm" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">활동 가능 시간 (기상 - 취침)</label>
            <input type="text" id="wakeSleepTime" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500" value="07:30 - 23:30" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">고정 강의 및 미팅 일정</label>
            <textarea id="fixedSchedules" rows="4" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500" placeholder="예: 14:00 - 17:00 강남 특강 (오프라인)" required>14:00 - 17:00 강남 파이낸스센터 오프라인 강의
20:00 - 21:30 온라인 줌 질의응답 세션</textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">채우고 싶은 루틴 (공부/운동 등)</label>
            <textarea id="priorities" rows="3" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500">강의 슬라이드 보완 1시간 30분
근력 운동 40분
강의 주제 최신 트렌드 리딩 40분</textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">특이사항/이동 팁</label>
            <input type="text" id="notes" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:border-indigo-500" value="강의 전 목 관리, 이동 시간 팟캐스트 청취" />
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-3 rounded-lg transition-all shadow-md">
            AI 맞춤 루틴 재배치하기
          </button>
        </form>
      </section>

      <!-- 결과 타임라인 -->
      <section class="bg-slate-800/50 p-6 rounded-2xl border border-slate-800 md:col-span-2">
        <h2 class="text-sm font-semibold text-slate-200 mb-4 pb-2 border-b border-slate-700/60">생성된 스마트 타임라인</h2>

        <!-- 빈 상태 안내 -->
        <div id="emptyState" class="py-24 text-center">
          <div class="w-12 h-12 bg-slate-700/40 rounded-xl mx-auto flex items-center justify-center text-slate-400 mb-3">📅</div>
          <p class="text-sm font-medium text-slate-300">아직 생성된 플랜이 없습니다</p>
          <p class="text-xs text-slate-500 mt-1">왼쪽 일정을 확인하고 [AI 맞춤 루틴 재배치하기]를 눌러보세요.</p>
        </div>

        <!-- 로딩 -->
        <div id="loading" class="hidden py-24 text-center space-y-3">
          <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
          <p class="text-xs text-slate-400">강의 전후 버퍼 및 최적 시간을 분석하여 루틴을 재배치 중입니다...</p>
        </div>

        <!-- 결과 표시 컨테이너 -->
        <div id="resultContainer" class="hidden space-y-4">
          <div id="summaryCard" class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-xl text-xs text-indigo-200 font-medium"></div>
          <div id="timelineList" class="relative pl-6 space-y-4 before:content-[''] before:absolute before:left-2 before:top-2 before:bottom-2 before:w-0.5 before:bg-slate-700"></div>
        </div>
      </section>

    </div>
  </div>

  <script>
    const categoryBadgeColors = {
      '강의': 'bg-amber-500/20 text-amber-300 border-amber-500/40',
      '강의준비': 'bg-blue-500/20 text-blue-300 border-blue-500/40',
      '공부': 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
      '운동': 'bg-rose-500/20 text-rose-300 border-rose-500/40',
      '이동': 'bg-purple-500/20 text-purple-300 border-purple-500/40',
      '휴식/식사': 'bg-slate-600/20 text-slate-300 border-slate-600/40'
    };

    document.getElementById('routineForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const resultContainer = document.getElementById('resultContainer');
      const emptyState = document.getElementById('emptyState');
      const timelineList = document.getElementById('timelineList');
      const summaryCard = document.getElementById('summaryCard');
      const errorBanner = document.getElementById('errorBanner');
      const errorMessage = document.getElementById('errorMessage');

      errorBanner.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-50');
      loading.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      emptyState.classList.add('hidden');

      const payload = {
        wakeSleepTime: document.getElementById('wakeSleepTime').value,
        fixedSchedules: document.getElementById('fixedSchedules').value,
        priorities: document.getElementById('priorities').value,
        notes: document.getElementById('notes').value
      };

      try {
        // Vercel 서버리스 함수 호출
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status} 오류 발생`);
        }

        summaryCard.textContent = `💡 오늘의 전략: ${data.summary}`;
        timelineList.innerHTML = '';

        if (Array.isArray(data.schedule)) {
          data.schedule.forEach(item => {
            const badgeClass = categoryBadgeColors[item.category] || 'bg-slate-700 text-slate-300 border-slate-600';
            const el = document.createElement('div');
            el.className = 'relative flex items-start space-x-3';
            el.innerHTML = `
              <div class="absolute -left-6 mt-1.5 w-2 h-2 rounded-full bg-slate-500 ring-4 ring-slate-900"></div>
              <div class="flex-1 bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 hover:border-slate-700 transition-colors">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="text-xs font-semibold text-slate-400">${item.time}</span>
                  <span class="text-[10px] font-medium px-2 py-0.5 rounded-full border ${badgeClass}">${item.category}</span>
                </div>
                <p class="text-xs font-semibold text-white">${item.activity}</p>
                <p class="text-[11px] text-slate-400 mt-1">💡 ${item.tip}</p>
              </div>
            `;
            timelineList.appendChild(el);
          });
        }

        resultContainer.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        errorMessage.textContent = err.message;
        errorBanner.classList.remove('hidden');
        emptyState.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50');
      }
    });

    document.getElementById('loadSampleBtn').addEventListener('click', () => {
      document.getElementById('wakeSleepTime').value = '07:00 - 23:30';
      document.getElementById('fixedSchedules').value = '10:00 - 12:00 기업 온라인 웨비나\n15:00 - 18:00 판교 스타트업 출강';
      document.getElementById('priorities').value = '스피치 교재 수정 1시간\n러닝 30분\n신기술 트렌드 스터디 45분';
      document.getElementById('notes').value = '대중교통 이동 중 오디오 강의 청취, 판교 도착 후 현장 세팅 20분 확보';
    });
  </script>
</body>
</html>
